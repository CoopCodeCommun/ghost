# Plusieurs instances Ghost peuvent cohabiter sur le meme serveur : chaque stack
# a son dossier, son COMPOSE_PROJECT_NAME et son DOMAIN (voir README).
# D'ou l'absence de container_name : Docker nomme les conteneurs d'apres le projet.
services:
  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    volumes:
      - ./ghost:/var/lib/ghost/content
    environment:
      NODE_ENV: production
      url: https://${DOMAIN:?DOMAIN doit etre renseigne dans .env}

      database__client: mysql
      database__connection__host: ghost-mysql
      database__connection__user: ${MYSQL_USER:-ghost}
      database__connection__password: ${MYSQL_PASSWORD:?MYSQL_PASSWORD doit etre renseigne dans .env}
      database__connection__database: ghost

      # Sans SMTP : plus de connexion staff, d'invitation ni de reset de mot de passe.
      mail__transport: SMTP
      mail__options__host: ${MAIL_HOST:?MAIL_HOST doit etre renseigne dans .env}
      mail__options__port: ${MAIL_PORT:-465}
      mail__options__secure: ${MAIL_SECURE:-true}
      mail__options__auth__user: ${MAIL_USER:?MAIL_USER doit etre renseigne dans .env}
      mail__options__auth__pass: ${MAIL_PASSWORD:?MAIL_PASSWORD doit etre renseigne dans .env}
      mail__from: ${MAIL_FROM:?MAIL_FROM doit etre renseigne dans .env}
    healthcheck:
      # On ne suit pas les redirections : Ghost renvoie un 301 vers https://$DOMAIN
      # sur une requete locale en http. Tout code < 500 signifie "Ghost repond".
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:2368,path:'/ghost/api/admin/site/'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      # Les noms de routers/services Traefik sont globaux : on les derive du nom
      # de projet pour que deux Ghost sur le meme serveur ne se marchent pas dessus.
      # A defaut de COMPOSE_PROJECT_NAME dans .env, compose prend le nom du dossier.
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=myresolver
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`$DOMAIN`)
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=2368
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend
    depends_on:
      ghost-mysql:
        condition: service_healthy

  ghost-mysql:
    image: mysql:8.0
    restart: unless-stopped
    expose:
      - 3306
    volumes:
      - ./db:/var/lib/mysql
    environment:
      # Ces trois mots de passe ne doivent plus jamais changer une fois la base initialisee.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD doit etre renseigne dans .env}
      MYSQL_USER: ${MYSQL_USER:-ghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD doit etre renseigne dans .env}
      MYSQL_DATABASE: ghost
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend


networks:
  # Reseau partage avec Traefik, deja cree sur le serveur.
  frontend:
    external: true
  # Reseau prive Ghost <-> MySQL : la base n'est pas joignable depuis frontend.
  backend:
